name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kalyra
          POSTGRES_PASSWORD: kalyra
          POSTGRES_DB: kalyra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kalyra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://kalyra:kalyra@localhost:5432/kalyra_test
      # Tests mock every external provider; no real API keys are used in CI.
      GEOAPIFY_API_KEY: ""
      IGNAV_API_KEY: ""

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test:unit

      - name: Create database schema
        run: pnpm --filter @workspace/db run push-force

      - name: Database and API tests
        run: pnpm run test:db
